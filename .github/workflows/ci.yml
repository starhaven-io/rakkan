name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # required to read PR titles
    uses: starhaven-io/.github/.github/workflows/reusable-conventional-commits.yml@85b63590380becacd87cf3cccf8c2d6ea8146fad # v2026.09.28.1

  engine:
    name: Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true

      - name: Prepare databases
        run: |
          cp .env.example .env
          bundle exec hanami db prepare

      - name: RSpec
        run: COVERAGE=true bundle exec rspec

      - name: Validate committed seeds
        run: |
          bundle exec ruby research/check_rubygems_seed_update.rb --structural seed/rubygems
          bundle exec ruby research/check_cratesio_seed_update.rb --structural seed/cratesio

      - name: Normalize report paths
        if: success()
        run: python3 -I scripts/upload-codecov.py --prepare --coverage coverage/coverage.xml

      - name: Save engine coverage report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-coverage-report
          path: coverage/coverage.xml
          if-no-files-found: error
          retention-days: 1

      - name: RuboCop
        run: bundle exec rubocop

      - name: ShellCheck
        run: shellcheck bin/setup scripts/*.sh

      - name: Install typos-cli
        env:
          TYPOS_SHA256: "abcb3e257c7c2abeff4d903f7fe68071357637605bdb283ce2251f44bc70dc09"
        run: |
          archive="${RUNNER_TEMP}/typos.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "${archive}" \
            "https://github.com/crate-ci/typos/releases/download/v1.50.2/typos-v1.50.2-x86_64-unknown-linux-musl.tar.gz"
          echo "${TYPOS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" ./typos
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Typos
        run: typos

  site:
    name: Site
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/var/cache/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        # Held at v6 until pinprick's source scan covers setup-node v7.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Check npm install-script policy
        run: node scripts/check-npm-install-policy.mjs site

      - name: Install dependencies
        working-directory: site
        # Fail if an unreviewed dependency install script is introduced.
        run: npm ci --strict-allow-scripts

      - name: Prettier
        working-directory: site
        run: npm run format:check

      - name: Astro check
        working-directory: site
        run: npm run check

      - name: Test
        working-directory: site
        run: npm run test:coverage

      - name: Normalize report paths
        if: success()
        run: python3 -I scripts/upload-codecov.py --prepare --coverage site/coverage/lcov.info

      - name: Save site coverage report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-coverage-report
          path: site/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Build
        working-directory: site
        run: npm run build

      - name: Deploy dry-run
        working-directory: site
        run: npm run deploy:dry
        env:
          WRANGLER_SEND_METRICS: "false"

  zizmor:
    name: zizmor
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write # required for zizmor SARIF upload
    uses: starhaven-io/.github/.github/workflows/reusable-zizmor.yml@85b63590380becacd87cf3cccf8c2d6ea8146fad # v2026.09.28.1
    with:
      advanced-security: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  pinprick:
    name: pinprick
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-pinprick-audit.yml@85b63590380becacd87cf3cccf8c2d6ea8146fad # v2026.09.28.1
    with:
      advanced-security: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      fail-on-findings: true

  codeql:
    name: CodeQL
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@85b63590380becacd87cf3cccf8c2d6ea8146fad # v2026.09.28.1
    with:
      languages: '["actions","javascript-typescript","ruby"]'
      runner: "ubuntu-24.04"
      timeout-minutes: 30
      build-mode: ""
      build-profile: ""

  codecov:
    name: Codecov
    needs: [engine, site]
    # Forks still run coverage tests; Codecov OIDC accepts same-repository runs.
    if: needs.engine.result == 'success' && needs.site.result == 'success' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Authenticate report uploads to Codecov with GitHub OIDC.
    steps:
      - name: Check out the trusted uploader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: /scripts/upload-codecov.py
          sparse-checkout-cone-mode: false
          path: codecov-uploader

      - name: Download engine-coverage-report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-coverage-report
          path: reports/engine

      - name: Download site-coverage-report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-coverage-report
          path: reports/site

      - name: Upload reports with verified Codecov CLI
        run: >-
          python3 -I codecov-uploader/scripts/upload-codecov.py
          --coverage reports/engine/coverage.xml
          --coverage reports/site/lcov.info

  # The org's Require Conclusion ruleset needs an always-reporting aggregate
  # check with exactly this name.
  conclusion:
    name: conclusion
    needs: [commits, engine, site, zizmor, pinprick, codeql, codecov]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: always()
    steps:
      - name: Result
        env:
          COMMITS_RESULT: ${{ needs.commits.result }}
          ENGINE_RESULT: ${{ needs.engine.result }}
          SITE_RESULT: ${{ needs.site.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          PINPRICK_RESULT: ${{ needs.pinprick.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          CODECOV_RESULT: ${{ needs.codecov.result }}
          UPLOAD_ALLOWED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          require_result() {
            local name="$1" result="$2" required="$3"
            case "${required}" in
              true) test "${result}" = success ;;
              false) test "${result}" = skipped ;;
              *) echo "::error::Invalid routing decision for ${name}."; return 1 ;;
            esac || { echo "::error::${name} ended with ${result:-no result}."; return 1; }
          }

          case "${GITHUB_EVENT_NAME}" in
            pull_request) REQUIRE_PR_CHECKS=true ;;
            push) REQUIRE_PR_CHECKS=false ;;
            *) echo "::error::Unexpected CI event."; exit 1 ;;
          esac
          require_result engine "${ENGINE_RESULT}" true
          require_result site "${SITE_RESULT}" true
          require_result commits "${COMMITS_RESULT}" "${REQUIRE_PR_CHECKS}"
          require_result zizmor "${ZIZMOR_RESULT}" "${REQUIRE_PR_CHECKS}"
          require_result pinprick "${PINPRICK_RESULT}" "${REQUIRE_PR_CHECKS}"
          require_result codeql "${CODEQL_RESULT}" "${REQUIRE_PR_CHECKS}"
          require_result codecov "${CODECOV_RESULT}" "${UPLOAD_ALLOWED}"
