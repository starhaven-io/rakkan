name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # required to read PR titles
    uses: starhaven-io/.github/.github/workflows/reusable-conventional-commits.yml@fa61548f8fe7ee08b5b939bfbec5900c6c54306d # v2026.09.06.4

  engine:
    name: Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Prepare databases
        run: |
          cp .env.example .env
          bundle exec hanami db prepare

      - name: RSpec
        run: COVERAGE=true bundle exec rspec

      - name: Validate committed seeds
        run: |
          bundle exec ruby research/check_rubygems_seed_update.rb --structural seed/rubygems
          bundle exec ruby research/check_cratesio_seed_update.rb --structural seed/cratesio

      - name: Save engine coverage report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-coverage-report
          path: coverage/coverage.xml
          if-no-files-found: error
          retention-days: 1

      - name: RuboCop
        run: bundle exec rubocop

      - name: ShellCheck
        run: shellcheck bin/setup scripts/*.sh

      - name: actionlint
        env:
          GOTOOLCHAIN: local
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Ruby dependency audit
        run: bundle exec bundler-audit check --update

      - name: Restore typos cache
        id: typos-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/typos
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-typos-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-typos-

      - name: Install typos-cli
        run: cargo install typos-cli --locked --version 1.50.0

      - name: Typos
        run: typos

      - name: Save typos cache
        if: github.event_name == 'push' && steps.typos-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/typos
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-typos-${{ hashFiles('.github/workflows/ci.yml') }}

  site:
    name: Site
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/var/cache/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Check npm install-script policy
        run: node scripts/check-npm-install-policy.mjs site

      - name: Install dependencies
        working-directory: site
        # Fail if an unreviewed dependency install script is introduced.
        run: npm ci --strict-allow-scripts

      - name: npm dependency audit
        working-directory: site
        run: npm audit --audit-level=high

      - name: Prettier
        working-directory: site
        run: npm run format:check

      - name: Astro check
        working-directory: site
        run: npm run check

      - name: Test
        working-directory: site
        run: npm run test:coverage

      - name: Save site coverage report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-coverage-report
          path: site/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Build
        working-directory: site
        run: npm run build

      - name: Deploy dry-run
        working-directory: site
        run: npm run deploy:dry
        env:
          WRANGLER_SEND_METRICS: "false"

  zizmor:
    name: zizmor
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write # required for zizmor SARIF upload
    uses: starhaven-io/.github/.github/workflows/reusable-zizmor.yml@fa61548f8fe7ee08b5b939bfbec5900c6c54306d # v2026.09.06.4
    with:
      advanced-security: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  pinprick:
    name: pinprick
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-pinprick-audit.yml@fa61548f8fe7ee08b5b939bfbec5900c6c54306d # v2026.09.06.4
    with:
      advanced-security: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      fail-on-findings: true

  codeql:
    name: CodeQL
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@fa61548f8fe7ee08b5b939bfbec5900c6c54306d # v2026.09.06.4
    with:
      languages: '["actions","javascript-typescript","ruby"]'
      runner: "ubuntu-24.04"
      timeout-minutes: 30
      build-mode: ""
      build-profile: ""

  codecov:
    name: Codecov
    needs: [engine, site]
    if: needs.engine.result == 'success' && needs.site.result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for Codecov OIDC authentication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download engine coverage report
        id: download-engine-coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-coverage-report
          path: coverage/engine

      - name: Download site coverage report
        id: download-site-coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-coverage-report
          path: coverage/site

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: coverage/engine/coverage.xml,coverage/site/lcov.info
          fail_ci_if_error: true

  # The org's Require Conclusion ruleset needs an always-reporting aggregate
  # check with exactly this name.
  conclusion:
    name: conclusion
    needs: [commits, engine, site, zizmor, pinprick, codeql, codecov]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: always()
    steps:
      - name: Result
        env:
          COMMITS_RESULT: ${{ needs.commits.result }}
          ENGINE_RESULT: ${{ needs.engine.result }}
          SITE_RESULT: ${{ needs.site.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          PINPRICK_RESULT: ${{ needs.pinprick.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          CODECOV_RESULT: ${{ needs.codecov.result }}
        run: |
          for result in \
            "${COMMITS_RESULT}" \
            "${ENGINE_RESULT}" \
            "${SITE_RESULT}" \
            "${ZIZMOR_RESULT}" \
            "${PINPRICK_RESULT}" \
            "${CODEQL_RESULT}" \
            "${CODECOV_RESULT}"
          do
            test "${result}" = "success" || test "${result}" = "skipped"
          done
