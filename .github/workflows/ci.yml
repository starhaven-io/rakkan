name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # required to read PR titles
    uses: starhaven-io/.github/.github/workflows/reusable-conventional-commits.yml@a93cbf1e015e136ea9d2c19e427dfd5af82b7662 # v2026.08.19.1

  engine:
    name: Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Prepare databases
        run: |
          cp .env.example .env
          bundle exec hanami db prepare

      - name: RSpec
        run: bundle exec rspec

      - name: RuboCop
        run: bundle exec rubocop

      - name: Install typos-cli
        run: cargo install typos-cli --locked --version 1.49.0

      - name: Typos
        run: typos

  site:
    name: Site
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Check npm install-script policy
        run: node scripts/check-npm-install-policy.mjs site

      - name: Install dependencies
        working-directory: site
        # Fail if an unreviewed dependency install script is introduced.
        run: npm ci --strict-allow-scripts

      - name: Test
        working-directory: site
        run: npm run test

      - name: Build
        working-directory: site
        run: npm run build

      - name: Deploy dry-run
        working-directory: site
        run: npm run deploy:dry
        env:
          WRANGLER_SEND_METRICS: "false"

  zizmor:
    name: zizmor
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write # required for zizmor SARIF upload
    uses: starhaven-io/.github/.github/workflows/reusable-zizmor.yml@a93cbf1e015e136ea9d2c19e427dfd5af82b7662 # v2026.08.19.1
    with:
      advanced-security: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  pinprick:
    name: pinprick
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-pinprick-audit.yml@a93cbf1e015e136ea9d2c19e427dfd5af82b7662 # v2026.08.19.1
    with:
      advanced-security: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      fail-on-findings: true

  codeql:
    name: CodeQL
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@a93cbf1e015e136ea9d2c19e427dfd5af82b7662 # v2026.08.19.1
    with:
      languages: '["actions","javascript-typescript","ruby"]'
      runner: "ubuntu-24.04"
      timeout-minutes: 30
      build-mode: ""
      build-profile: ""

  # The org's Require Conclusion ruleset needs an always-reporting aggregate
  # check with exactly this name.
  conclusion:
    name: conclusion
    needs: [commits, engine, site, zizmor, pinprick, codeql]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: always()
    steps:
      - name: Result
        env:
          COMMITS_RESULT: ${{ needs.commits.result }}
          ENGINE_RESULT: ${{ needs.engine.result }}
          SITE_RESULT: ${{ needs.site.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          PINPRICK_RESULT: ${{ needs.pinprick.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          for result in \
            "${COMMITS_RESULT}" \
            "${ENGINE_RESULT}" \
            "${SITE_RESULT}" \
            "${ZIZMOR_RESULT}" \
            "${PINPRICK_RESULT}" \
            "${CODEQL_RESULT}"
          do
            test "${result}" = "success" || test "${result}" = "skipped"
          done
