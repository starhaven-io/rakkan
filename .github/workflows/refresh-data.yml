name: Refresh Data

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to refresh
        required: true
        default: rubygems
        type: choice
        options:
          - rubygems
          - cratesio
      refresh_limit:
        description: Maximum provenance lookups per attempt
        required: true
        default: "250"
        type: string
  schedule:
    # RubyGems publishes its weekly dump on Monday; refresh after it lands.
    - cron: "17 06 * * 2"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-data.yml"
      - "config/db/migrate/**"
      - "config/db/structure.sql"
      - "db/normalize_rubygems_weekly_snapshots.sql"
      - "scripts/normalize-rubygems-weekly-snapshots.sh"
      - "seed/rubygems/**"

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: refresh-data
  cancel-in-progress: false # never interrupt a production D1 replacement

jobs:
  refresh:
    name: Refresh registry data
    if: github.repository_owner == 'starhaven-io'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # required to checkout repository
    environment: cloudflare
    env:
      DATABASE_URL: sqlite://db/rakkan.sqlite
      HANAMI_ENV: production
      REGISTRY: ${{ inputs.registry || 'rubygems' }}
      REFRESH_LIMIT: ${{ inputs.refresh_limit || '250' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate refresh inputs
        run: |
          if ! [[ "${REGISTRY}" =~ ^(rubygems|cratesio)$ ]]; then
            echo "::error::registry must be rubygems or cratesio"
            exit 1
          fi
          if ! [[ "${REFRESH_LIMIT}" =~ ^[1-9][0-9]{0,3}$ ]] || (( REFRESH_LIMIT > 1000 )); then
            echo "::error::refresh_limit must be an integer from 1 to 1000"
            exit 1
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Check npm install-script policy
        run: node scripts/check-npm-install-policy.mjs site

      - name: Install Wrangler
        working-directory: site
        # Fail if an unreviewed dependency install script is introduced.
        run: npm ci --strict-allow-scripts

      - name: Prepare fresh engine database
        run: bundle exec hanami db prepare

      - name: Export current production data
        working-directory: site
        run: |
          ./node_modules/.bin/wrangler d1 export rakkan \
            --remote \
            --skip-confirmation \
            --no-schema \
            --table=registries \
            --table=packages \
            --table=package_versions \
            --table=adoption_snapshots \
            --output="${D1_DATA_SQL}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATA_SQL: ${{ runner.temp }}/rakkan-d1-data.sql
          WRANGLER_SEND_METRICS: "false"

      - name: Restore production history
        env:
          D1_DATA_SQL: ${{ runner.temp }}/rakkan-d1-data.sql
        run: |
          sqlite3 db/rakkan.sqlite <<SQL
          .bail on
          PRAGMA foreign_keys = ON;
          BEGIN IMMEDIATE;
          .read ${D1_DATA_SQL}
          COMMIT;
          SQL

          violations="$(sqlite3 db/rakkan.sqlite 'PRAGMA foreign_key_check;')"
          test -z "${violations}"

          for table in registries packages package_versions adoption_snapshots; do
            rows="$(sqlite3 db/rakkan.sqlite "SELECT COUNT(*) FROM ${table};")"
            if (( rows == 0 )); then
              echo "::error::production export contained no ${table} rows"
              exit 1
            fi
          done

      - name: Ingest registry changes
        run: |
          bundle exec rake "ingest:seed[${REGISTRY}]"
          if [[ "${REGISTRY}" == "rubygems" ]]; then
            # A capped attempt persists its cursor in this job's database; retry
            # here so a backlog can converge before any snapshot is published.
            for attempt in 1 2 3; do
              if bundle exec rake "ingest:discover[${REGISTRY}]"; then
                break
              fi
              if (( attempt == 3 )); then
                echo "::error::ingest:discover did not drain after ${attempt} attempts"
                exit 1
              fi
              echo "::warning::ingest:discover reached its page budget; retrying from its cursor"
            done
          fi
          refresh_deadline=$(( SECONDS + 1800 - REFRESH_LIMIT ))
          refresh_result=""
          for attempt in 1 2 3; do
            if refresh_result="$(bundle exec rake "ingest:refresh[${REFRESH_LIMIT},${REGISTRY}]")"; then
              printf '%s\n' "${refresh_result}"
              break
            fi
            if (( attempt == 3 || SECONDS >= refresh_deadline )); then
              echo "::error::ingest:refresh did not complete within its retry budget"
              exit 1
            fi
            echo "::warning::ingest:refresh failed; retrying from its persisted checks"
          done

          refresh_payload="${refresh_result##*$'\n'}"
          if ! remaining="$(jq -er '.remaining | select(type == "number" and . >= 0)' <<< "${refresh_payload}")"; then
            echo "::error::ingest:refresh did not report a valid remaining count"
            exit 1
          fi
          echo "${REGISTRY}: ${remaining} tracked versions remain unchecked" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${REGISTRY}" == "cratesio" && "${remaining}" -gt 0 ]]; then
            echo "crates.io backfill remains in progress; publishing the durable cursor without a snapshot" \
              >> "${GITHUB_STEP_SUMMARY}"
          else
            bundle exec rake "snapshot:take[${REGISTRY}]"
          fi

      - name: Align RubyGems history to weekly dumps
        run: bash scripts/normalize-rubygems-weekly-snapshots.sh db/rakkan.sqlite

      - name: Export refreshed D1 database
        run: bundle exec rake export:d1

      - name: Replace production data
        if: github.event_name != 'push'
        working-directory: site
        run: ./node_modules/.bin/wrangler d1 execute rakkan --remote --file=../db/d1_export.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

      - name: Report dry run
        if: github.event_name == 'push'
        run: echo "Ingestion and export completed as a dry run; production D1 was not replaced." >> "${GITHUB_STEP_SUMMARY}"

  refresh-issue:
    name: Open/close refresh issue
    needs: refresh
    if: ${{ always() && github.event_name != 'push' && (needs.refresh.result == 'success' || needs.refresh.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true # issue bookkeeping must not override the refresh result
    permissions:
      issues: write # required to find, create, comment on, and close the failure issue
    steps:
      - name: Open, update, or close refresh issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: Refresh data workflow failing (${{ inputs.registry || 'rubygems' }})
          REFRESH_RESULT: ${{ needs.refresh.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          retry_gh() {
            local attempt output
            for attempt in 1 2 3; do
              if output="$(gh "$@")"; then
                printf '%s\n' "${output}"
                return 0
              fi
              if [ "${attempt}" -lt 3 ]; then
                echo "::warning::gh $1 failed on attempt ${attempt}; retrying in 5 seconds" >&2
                sleep 5
              fi
            done
            return 1
          }

          if ! numbers="$(retry_gh api --paginate --method GET "repos/${GH_REPO}/issues" \
              -f state=open \
              -f 'creator=github-actions[bot]' \
              -f per_page=100 \
              --jq '.[] | select(.title == env.ISSUE_TITLE and (has("pull_request") | not)) | .number')"; then
            echo "::warning::failed to list refresh failure issues"
            exit 1
          fi

          bookkeeping_status=0

          if [ "${REFRESH_RESULT}" = "success" ]; then
            while IFS= read -r number; do
              [ -n "${number}" ] || continue
              if ! retry_gh issue close "${number}" --reason completed \
                  --comment "Refresh run succeeded: ${RUN_URL}" </dev/null; then
                echo "::warning::failed to close refresh issue #${number}"
                bookkeeping_status=1
              fi
            done <<< "${numbers}"
          elif [ "${REFRESH_RESULT}" = "failure" ]; then
            number="${numbers%%$'\n'*}"
            if [ -n "${number}" ]; then
              if ! retry_gh issue comment "${number}" --body "Refresh run failed: ${RUN_URL}" </dev/null; then
                echo "::warning::failed to comment on refresh issue #${number}"
                bookkeeping_status=1
              fi
            else
              issue_body="$(printf 'Refresh run failed: %s\n\nFiled automatically by refresh-data.yml; the next successful refresh closes this issue.\n' \
                "${RUN_URL}")"
              if ! retry_gh issue create --title "${ISSUE_TITLE}" --body "${issue_body}" </dev/null; then
                echo "::warning::failed to create refresh failure issue"
                bookkeeping_status=1
              fi
            fi
          fi

          exit "${bookkeeping_status}"
