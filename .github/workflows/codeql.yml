name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "bin/**"
      - "scripts/**"
      - "config/**"
      - "lib/**"
      - "research/**"
      - "site/**"
      - "slices/**"
      - "Gemfile"
      - "Rakefile"

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@77467585a669227a235d6660c7331487acb916aa # v2026.10.10.3
    with:
      languages: '["actions","javascript-typescript","ruby"]'
      runner: "ubuntu-24.04"
      timeout-minutes: 30
      build-mode: ""
      build-profile: ""
