name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "config/**"
      - "lib/**"
      - "research/**"
      - "site/**"
      - "slices/**"
      - "Gemfile"
      - "Rakefile"

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@7b7327f6525b2e72ff64200c0b9ba5051a30bd2f # v2026.09.07.2
    with:
      languages: '["actions","javascript-typescript","ruby"]'
      runner: "ubuntu-24.04"
      timeout-minutes: 30
      build-mode: ""
      build-profile: ""
