name: Update crates.io seed

on:
  workflow_dispatch:
  schedule:
    # The daily dump normally lands around 02:00 UTC; keep observations on Mondays.
    - cron: "0 05 * * 1"

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: update-cratesio-seed
  cancel-in-progress: false

jobs:
  update:
    name: Generate seed update
    if: github.repository_owner == 'starhaven-io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      base_sha: ${{ github.sha }}
      update_required: ${{ steps.seed.outputs.update_required }}
      dump_taken_at: ${{ steps.seed.outputs.dump_taken_at }}
      source_commit: ${{ steps.seed.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Verify runner tools
        run: |
          if [[ ! -x /usr/bin/time ]]; then
            echo "::error::/usr/bin/time is not available on this runner"
            exit 1
          fi
          for tool in gzip jq tar; do
            if ! command -v "${tool}" >/dev/null; then
              echo "::error::${tool} is not available on this runner"
              exit 1
            fi
          done

      - name: Set update paths
        run: |
          {
            echo "ARCHIVE=${RUNNER_TEMP}/cratesio-db-dump.tar.gz"
            echo "BUILD_METRICS=${RUNNER_TEMP}/cratesio-build-resources.txt"
            echo "DUMP_DIR=${RUNNER_TEMP}/cratesio-dump"
            echo "GENERATED_SEED=${RUNNER_TEMP}/cratesio-seed"
          } >> "${GITHUB_ENV}"

      - name: Record initial disk space
        id: disk-before
        run: |
          df --human-readable "${RUNNER_TEMP}"
          available="$(df --output=avail -B1 "${RUNNER_TEMP}" | tail -n 1 | tr -d ' ')"
          echo "bytes=${available}" >> "${GITHUB_OUTPUT}"
          {
            echo "## crates.io seed update"
            echo
            echo "Phase results are recorded as they complete."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Download daily dump
        id: download
        run: |
          started="${SECONDS}"
          result="$(bundle exec ruby research/download_cratesio_dump.rb "${ARCHIVE}")"
          elapsed=$(( SECONDS - started ))
          bytes="$(jq -er '.bytes | select(type == "number" and . > 0)' <<< "${result}")"
          test "$(stat --format=%s "${ARCHIVE}")" -eq "${bytes}"
          {
            echo "seconds=${elapsed}"
            echo "bytes=${bytes}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Download complete"
            echo
            echo "- Elapsed: ${elapsed}s"
            echo "- Archive: ${bytes} bytes"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Extract daily dump
        id: extract
        run: |
          mkdir -p "${DUMP_DIR}"
          started="${SECONDS}"
          tar --extract --gzip --file="${ARCHIVE}" --directory="${DUMP_DIR}" --strip-components=1
          elapsed=$(( SECONDS - started ))

          test -f "${DUMP_DIR}/metadata.json"
          for table in crate_downloads crates default_versions versions; do
            test -f "${DUMP_DIR}/data/${table}.csv"
          done

          dump_taken_at="$(jq -er '.timestamp | select(type == "string" and test("^[0-9TZ:.+-]+$"))' \
            "${DUMP_DIR}/metadata.json")"
          source_commit="$(jq -er '.crates_io_commit | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            "${DUMP_DIR}/metadata.json")"
          {
            echo "seconds=${elapsed}"
            echo "dump_taken_at=${dump_taken_at}"
            echo "source_commit=${source_commit}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Extraction complete"
            echo
            echo "- Elapsed: ${elapsed}s"
            echo "- Dump timestamp: \`${dump_taken_at}\`"
            echo "- crates.io source commit: \`${source_commit}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build seed
        id: build
        run: |
          started="${SECONDS}"
          /usr/bin/time --verbose --output="${BUILD_METRICS}" \
            bundle exec ruby research/build_cratesio_seed.rb "${DUMP_DIR}" "${GENERATED_SEED}"
          elapsed=$(( SECONDS - started ))

          seed_bytes="$(du --bytes --summarize "${GENERATED_SEED}" | cut -f1)"
          peak_rss_kib="$(awk -F: '/Maximum resident set size/ { gsub(/^[[:space:]]+/, "", $2); print $2 }' \
            "${BUILD_METRICS}")"
          test "${seed_bytes}" -gt 0
          test "${peak_rss_kib}" -gt 0

          {
            echo "seconds=${elapsed}"
            echo "seed_bytes=${seed_bytes}"
            echo "peak_rss_kib=${peak_rss_kib}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Seed build complete"
            echo
            echo "- Elapsed: ${elapsed}s"
            echo "- Generated seed: ${seed_bytes} bytes"
            echo "- Builder peak RSS: ${peak_rss_kib} KiB"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Evaluate seed update
        id: seed
        run: |
          result="$(bundle exec ruby research/check_cratesio_seed_update.rb seed/cratesio "${GENERATED_SEED}")"
          update_required="$(jq -er '.update_required | if . then "true" else "false" end' <<< "${result}")"
          dump_taken_at="$(jq -er '.dump_taken_at | select(type == "string")' <<< "${result}")"
          source_commit="$(jq -er '.source_commit | select(type == "string")' <<< "${result}")"
          packages="$(jq -er '.packages | select(type == "number" and . == 1000)' <<< "${result}")"
          versions="$(jq -er '.versions | select(type == "number" and . > 0)' <<< "${result}")"
          {
            echo "update_required=${update_required}"
            echo "dump_taken_at=${dump_taken_at}"
            echo "source_commit=${source_commit}"
            echo "packages=${packages}"
            echo "versions=${versions}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Seed comparison complete"
            echo
            echo "- Content changed: ${update_required}"
            echo "- Tracked packages: ${packages}"
            echo "- Tracked versions: ${versions}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Package seed candidate
        if: steps.seed.outputs.update_required == 'true'
        run: |
          tar --create --gzip --file="${RUNNER_TEMP}/cratesio-seed-candidate.tgz" \
            --directory="${GENERATED_SEED}" manifest.json top_1000.tsv tracked_versions.tsv.gz

      - name: Upload seed candidate
        if: steps.seed.outputs.update_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cratesio-seed-candidate
          path: ${{ runner.temp }}/cratesio-seed-candidate.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Record final disk space
        id: disk-after
        run: |
          df --human-readable "${RUNNER_TEMP}"
          available="$(df --output=avail -B1 "${RUNNER_TEMP}" | tail -n 1 | tr -d ' ')"
          echo "bytes=${available}" >> "${GITHUB_OUTPUT}"

      - name: Report measurements
        env:
          ARCHIVE_BYTES: ${{ steps.download.outputs.bytes }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
          DISK_AFTER_BYTES: ${{ steps.disk-after.outputs.bytes }}
          DISK_BEFORE_BYTES: ${{ steps.disk-before.outputs.bytes }}
          DOWNLOAD_SECONDS: ${{ steps.download.outputs.seconds }}
          EXTRACT_SECONDS: ${{ steps.extract.outputs.seconds }}
          PACKAGES: ${{ steps.seed.outputs.packages }}
          PEAK_RSS_KIB: ${{ steps.build.outputs.peak_rss_kib }}
          SEED_BYTES: ${{ steps.build.outputs.seed_bytes }}
          VERSIONS: ${{ steps.seed.outputs.versions }}
        run: |
          disk_used_bytes=$(( DISK_BEFORE_BYTES - DISK_AFTER_BYTES ))
          total_seconds=$(( DOWNLOAD_SECONDS + EXTRACT_SECONDS + BUILD_SECONDS ))
          {
            echo "### Consolidated result"
            echo
            echo "| Phase | Seconds |"
            echo "| --- | ---: |"
            echo "| Download | ${DOWNLOAD_SECONDS} |"
            echo "| Extract | ${EXTRACT_SECONDS} |"
            echo "| Build seed | ${BUILD_SECONDS} |"
            echo "| Total | ${total_seconds} |"
            echo
            echo "| Output | Value |"
            echo "| --- | ---: |"
            echo "| Archive bytes | ${ARCHIVE_BYTES} |"
            echo "| Generated seed bytes | ${SEED_BYTES} |"
            echo "| Tracked packages | ${PACKAGES} |"
            echo "| Tracked versions | ${VERSIONS} |"
            echo "| Builder peak RSS (KiB) | ${PEAK_RSS_KIB} |"
            echo "| Runner disk consumed (bytes) | ${disk_used_bytes} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  propose:
    name: Propose seed pull request
    needs: update
    if: needs.update.outputs.update_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: starhaven
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.base_sha }}
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Download seed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cratesio-seed-candidate
          path: ${{ runner.temp }}/artifact

      - name: Verify seed candidate
        run: |
          candidate="${RUNNER_TEMP}/candidate-seed"
          tgz="${RUNNER_TEMP}/artifact/cratesio-seed-candidate.tgz"
          mkdir -p "${candidate}"

          entries="$(tar --list --gzip --file="${tgz}")"
          expected=$'manifest.json\ntop_1000.tsv\ntracked_versions.tsv.gz'
          if [[ "$(sort <<< "${entries}")" != "$(sort <<< "${expected}")" ]]; then
            echo "::error::seed candidate artifact contained unexpected entries"
            exit 1
          fi
          tar --extract --gzip --file="${tgz}" --directory="${candidate}"

          # Re-run the freshness and comparison gate against the committed seed
          # so this job never publishes an artifact the gate did not approve.
          result="$(bundle exec ruby research/check_cratesio_seed_update.rb seed/cratesio "${candidate}")"
          jq -er '.update_required == true' <<< "${result}" >/dev/null
          echo "CANDIDATE_SEED=${candidate}" >> "${GITHUB_ENV}"

      - name: Mint bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update automation branch and pull request
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          AUTOMATION_BRANCH: automation/cratesio-seed
          BASE_SHA: ${{ needs.update.outputs.base_sha }}
          DUMP_TAKEN_AT: ${{ needs.update.outputs.dump_taken_at }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_COMMIT: ${{ needs.update.outputs.source_commit }}
        run: |
          title="chore(data): refresh crates.io seed"
          bot_user="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot_user}" --jq .id)"
          commit_body="Signed-off-by: ${bot_user} <${bot_id}+${bot_user}@users.noreply.github.com>"

          if gh api "repos/${REPOSITORY}/git/ref/heads/${AUTOMATION_BRANCH}" >/dev/null 2>&1; then
            gh api "repos/${REPOSITORY}/git/refs/heads/${AUTOMATION_BRANCH}" \
              --method PATCH \
              --field "sha=${BASE_SHA}" \
              --field force=true
          else
            gh api "repos/${REPOSITORY}/git/refs" \
              --method POST \
              --field "ref=refs/heads/${AUTOMATION_BRANCH}" \
              --field "sha=${BASE_SHA}"
          fi

          # The encoded version seed is far larger than the kernel's per-argument
          # limit, so the mutation payload must reach gh through a file, never
          # through argv or the environment.
          payload_file="${RUNNER_TEMP}/create-seed-commit.json"
          # shellcheck disable=SC2016 # $input is a GraphQL variable, not shell
          TITLE="${title}" COMMIT_BODY="${commit_body}" \
            PAYLOAD_FILE="${payload_file}" ruby -rjson -e '
            seed = ENV.fetch("CANDIDATE_SEED")
            names = %w[manifest.json top_1000.tsv tracked_versions.tsv.gz]
            additions = names.map do |name|
              {
                path: "seed/cratesio/#{name}",
                contents: [File.binread(File.join(seed, name))].pack("m0")
              }
            end
            payload = {
              query: "mutation($input: CreateCommitOnBranchInput!) " \
                     "{ createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: ENV.fetch("REPOSITORY"),
                    branchName: ENV.fetch("AUTOMATION_BRANCH")
                  },
                  message: { headline: ENV.fetch("TITLE"), body: ENV.fetch("COMMIT_BODY") },
                  fileChanges: { additions: additions },
                  expectedHeadOid: ENV.fetch("BASE_SHA")
                }
              }
            }
            File.write(ENV.fetch("PAYLOAD_FILE"), JSON.generate(payload))
          '
          commit_url="$(gh api graphql --input "${payload_file}" --jq '.data.createCommitOnBranch.commit.url')"

          body_file="${RUNNER_TEMP}/seed-pr-body.md"
          {
            printf 'Refresh the committed crates.io top-1,000 seed from dump %s (source commit %s).\n\n' \
              "${DUMP_TAKEN_AT}" "${SOURCE_COMMIT}"
            printf 'Merging this pull request authorizes the protected crates.io data refresh; '
            printf 'the Refresh crates.io after seed merge workflow dispatches it automatically.\n\n'
            printf 'Auto-generated by the [seed update workflow](%s).\n' "${RUN_URL}"
          } > "${body_file}"

          existing="$(gh pr list --repo "${REPOSITORY}" --head "${AUTOMATION_BRANCH}" --base main \
            --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${existing}" ]]; then
            pr_url="$(gh pr create --repo "${REPOSITORY}" --base main --head "${AUTOMATION_BRANCH}" \
              --title "${title}" --body-file "${body_file}")"
          else
            gh pr edit "${existing}" --repo "${REPOSITORY}" --title "${title}" --body-file "${body_file}"
            pr_url="${GITHUB_SERVER_URL}/${REPOSITORY}/pull/${existing}"
          fi

          {
            echo "### Seed pull request ready"
            echo
            echo "- Commit: [${title}](${commit_url})"
            echo "- Pull request: ${pr_url}"
            echo
            echo "A reviewed human merge remains the production gate; the post-merge listener dispatches the protected refresh."
          } >> "${GITHUB_STEP_SUMMARY}"

  seed-issue:
    name: Open/close seed update issue
    needs: [update, propose]
    if: ${{ always() && (needs.update.result == 'success' || needs.update.result == 'failure' || needs.propose.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true # issue bookkeeping must not override the seed update result
    permissions:
      issues: write # required to find, create, comment on, and close the failure issue
    steps:
      - name: Open, update, or close seed update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: Update crates.io seed workflow failing
          PROPOSE_RESULT: ${{ needs.propose.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPDATE_RESULT: ${{ needs.update.result }}
        run: |
          if [ "${UPDATE_RESULT}" = "failure" ] || [ "${PROPOSE_RESULT}" = "failure" ]; then
            overall="failure"
          elif [ "${UPDATE_RESULT}" = "success" ] && { [ "${PROPOSE_RESULT}" = "success" ] || [ "${PROPOSE_RESULT}" = "skipped" ]; }; then
            overall="success"
          else
            exit 0
          fi

          retry_gh() {
            local attempt output
            for attempt in 1 2 3; do
              if output="$(gh "$@")"; then
                printf '%s\n' "${output}"
                return 0
              fi
              if [ "${attempt}" -lt 3 ]; then
                echo "::warning::gh $1 failed on attempt ${attempt}; retrying in 5 seconds" >&2
                sleep 5
              fi
            done
            return 1
          }

          if ! numbers="$(retry_gh api --paginate --method GET "repos/${GH_REPO}/issues" \
              -f state=open \
              -f 'creator=github-actions[bot]' \
              -f per_page=100 \
              --jq '.[] | select(.title == env.ISSUE_TITLE and (has("pull_request") | not)) | .number')"; then
            echo "::warning::failed to list seed update failure issues"
            exit 1
          fi

          bookkeeping_status=0

          if [ "${overall}" = "success" ]; then
            while IFS= read -r number; do
              [ -n "${number}" ] || continue
              if ! retry_gh issue close "${number}" --reason completed \
                  --comment "Seed update run succeeded: ${RUN_URL}" </dev/null; then
                echo "::warning::failed to close seed update issue #${number}"
                bookkeeping_status=1
              fi
            done <<< "${numbers}"
          else
            number="${numbers%%$'\n'*}"
            if [ -n "${number}" ]; then
              if ! retry_gh issue comment "${number}" --body "Seed update run failed: ${RUN_URL}" </dev/null; then
                echo "::warning::failed to comment on seed update issue #${number}"
                bookkeeping_status=1
              fi
            else
              issue_body="$(printf 'Seed update run failed: %s\n\nFiled automatically by update-cratesio-seed.yml; the next successful update closes this issue.\n' \
                "${RUN_URL}")"
              if ! retry_gh issue create --title "${ISSUE_TITLE}" --body "${issue_body}" </dev/null; then
                echo "::warning::failed to create seed update failure issue"
                bookkeeping_status=1
              fi
            fi
          fi

          exit "${bookkeeping_status}"
