name: Measure crates.io seed refresh

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: measure-cratesio-seed
  cancel-in-progress: false

jobs:
  measure:
    name: Measure download and distillation
    if: github.repository_owner == 'starhaven-io'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Verify measurement tools
        run: |
          if [[ ! -x /usr/bin/time ]]; then
            echo "::error::/usr/bin/time is not available on this runner"
            exit 1
          fi

      - name: Set measurement paths
        run: |
          {
            echo "ARCHIVE=${RUNNER_TEMP}/cratesio-db-dump.tar.gz"
            echo "BUILD_METRICS=${RUNNER_TEMP}/cratesio-build-resources.txt"
            echo "DUMP_DIR=${RUNNER_TEMP}/cratesio-dump"
            echo "GENERATED_SEED=${RUNNER_TEMP}/cratesio-seed"
          } >> "${GITHUB_ENV}"

      - name: Record initial disk space
        id: disk-before
        run: |
          df --human-readable "${RUNNER_TEMP}"
          available="$(df --output=avail -B1 "${RUNNER_TEMP}" | tail -n 1 | tr -d ' ')"
          echo "bytes=${available}" >> "${GITHUB_OUTPUT}"
          {
            echo "## crates.io seed refresh measurement"
            echo
            echo "Phase results are recorded as they complete."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Download daily dump
        id: download
        run: |
          started="${SECONDS}"
          result="$(bundle exec ruby research/download_cratesio_dump.rb "${ARCHIVE}")"
          elapsed=$(( SECONDS - started ))
          bytes="$(jq -er '.bytes | select(type == "number" and . > 0)' <<< "${result}")"
          test "$(stat --format=%s "${ARCHIVE}")" -eq "${bytes}"
          {
            echo "seconds=${elapsed}"
            echo "bytes=${bytes}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Download complete"
            echo
            echo "- Elapsed: ${elapsed}s"
            echo "- Archive: ${bytes} bytes"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Extract daily dump
        id: extract
        run: |
          mkdir -p "${DUMP_DIR}"
          started="${SECONDS}"
          tar --extract --gzip --file="${ARCHIVE}" --directory="${DUMP_DIR}" --strip-components=1
          elapsed=$(( SECONDS - started ))

          test -f "${DUMP_DIR}/metadata.json"
          for table in crate_downloads crates default_versions versions; do
            test -f "${DUMP_DIR}/data/${table}.csv"
          done

          dump_taken_at="$(jq -er '.timestamp | select(type == "string" and test("^[0-9TZ:.+-]+$"))' \
            "${DUMP_DIR}/metadata.json")"
          source_commit="$(jq -er '.crates_io_commit | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            "${DUMP_DIR}/metadata.json")"
          {
            echo "seconds=${elapsed}"
            echo "dump_taken_at=${dump_taken_at}"
            echo "source_commit=${source_commit}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Extraction complete"
            echo
            echo "- Elapsed: ${elapsed}s"
            echo "- Dump timestamp: \`${dump_taken_at}\`"
            echo "- crates.io source commit: \`${source_commit}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build seed
        id: build
        run: |
          started="${SECONDS}"
          /usr/bin/time --verbose --output="${BUILD_METRICS}" \
            bundle exec ruby research/build_cratesio_seed.rb "${DUMP_DIR}" "${GENERATED_SEED}"
          elapsed=$(( SECONDS - started ))

          packages=$(( $(wc -l < "${GENERATED_SEED}/top_1000.tsv") - 1 ))
          versions="$(gzip --decompress --stdout "${GENERATED_SEED}/tracked_versions.tsv.gz" | tail -n +2 | wc -l | tr -d ' ')"
          seed_bytes="$(du --bytes --summarize "${GENERATED_SEED}" | cut -f1)"
          peak_rss_kib="$(awk -F: '/Maximum resident set size/ { gsub(/^[[:space:]]+/, "", $2); print $2 }' \
            "${BUILD_METRICS}")"

          test "${packages}" -eq 1000
          test "${versions}" -gt 0
          test "${seed_bytes}" -gt 0
          test "${peak_rss_kib}" -gt 0

          {
            echo "seconds=${elapsed}"
            echo "packages=${packages}"
            echo "versions=${versions}"
            echo "seed_bytes=${seed_bytes}"
            echo "peak_rss_kib=${peak_rss_kib}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Seed build complete"
            echo
            echo "- Elapsed: ${elapsed}s"
            echo "- Generated seed: ${seed_bytes} bytes"
            echo "- Tracked packages: ${packages}"
            echo "- Tracked versions: ${versions}"
            echo "- Builder peak RSS: ${peak_rss_kib} KiB"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Record final disk space
        id: disk-after
        run: |
          df --human-readable "${RUNNER_TEMP}"
          available="$(df --output=avail -B1 "${RUNNER_TEMP}" | tail -n 1 | tr -d ' ')"
          echo "bytes=${available}" >> "${GITHUB_OUTPUT}"

      - name: Report measurements
        env:
          ARCHIVE_BYTES: ${{ steps.download.outputs.bytes }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
          DISK_AFTER_BYTES: ${{ steps.disk-after.outputs.bytes }}
          DISK_BEFORE_BYTES: ${{ steps.disk-before.outputs.bytes }}
          DOWNLOAD_SECONDS: ${{ steps.download.outputs.seconds }}
          DUMP_TAKEN_AT: ${{ steps.extract.outputs.dump_taken_at }}
          EXTRACT_SECONDS: ${{ steps.extract.outputs.seconds }}
          PACKAGES: ${{ steps.build.outputs.packages }}
          PEAK_RSS_KIB: ${{ steps.build.outputs.peak_rss_kib }}
          SEED_BYTES: ${{ steps.build.outputs.seed_bytes }}
          SOURCE_COMMIT: ${{ steps.extract.outputs.source_commit }}
          VERSIONS: ${{ steps.build.outputs.versions }}
        run: |
          disk_used_bytes=$(( DISK_BEFORE_BYTES - DISK_AFTER_BYTES ))
          total_seconds=$(( DOWNLOAD_SECONDS + EXTRACT_SECONDS + BUILD_SECONDS ))
          {
            echo "### Consolidated result"
            echo
            echo "| Phase | Seconds |"
            echo "| --- | ---: |"
            echo "| Download | ${DOWNLOAD_SECONDS} |"
            echo "| Extract | ${EXTRACT_SECONDS} |"
            echo "| Build seed | ${BUILD_SECONDS} |"
            echo "| Total | ${total_seconds} |"
            echo
            echo "| Output | Value |"
            echo "| --- | ---: |"
            echo "| Dump timestamp | \`${DUMP_TAKEN_AT}\` |"
            echo "| crates.io source commit | \`${SOURCE_COMMIT}\` |"
            echo "| Archive bytes | ${ARCHIVE_BYTES} |"
            echo "| Generated seed bytes | ${SEED_BYTES} |"
            echo "| Tracked packages | ${PACKAGES} |"
            echo "| Tracked versions | ${VERSIONS} |"
            echo "| Builder peak RSS (KiB) | ${PEAK_RSS_KIB} |"
            echo "| Runner disk consumed (bytes) | ${disk_used_bytes} |"
            echo
            echo "This manual workflow uses no environment, secrets, artifacts, or production writes."
          } >> "${GITHUB_STEP_SUMMARY}"
