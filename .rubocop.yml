AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 4.0
  Exclude:
    - "vendor/**/*"
    - "db/**/*"

# Ingestion operations and the streaming research scripts read as one
# narrative each; splitting them to satisfy a metric would hurt readability.
Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
